name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: docker build -t devops-practice-demo ./github-actions

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        docker tag devops-practice-demo ${{ secrets.DOCKER_USERNAME }}/devops-practice:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/devops-practice:latest
